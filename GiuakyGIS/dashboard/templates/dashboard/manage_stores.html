<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Cửa hàng & Thực đơn - Admin GIS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --sidebar-width: 250px;
            --bg-body: #f8f9fe;
            --primary-color: #5e72e4;
        }

        body { background-color: var(--bg-body); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            background: white;
            border-right: 1px solid #e9ecef;
            padding: 1.5rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand { font-size: 1.25rem; font-weight: bold; color: #32325d; margin-bottom: 2.5rem; display: block; text-decoration: none; }
        .sidebar-brand i { color: var(--primary-color); }
        
        .nav-section-title { font-size: 0.7rem; font-weight: 700; color: #adb5bd; text-transform: uppercase; letter-spacing: .04em; margin: 1.5rem 0 0.75rem; }
        .nav-link { color: #525f7f; padding: 0.65rem 1rem; border-radius: 0.375rem; margin-bottom: 0.25rem; transition: all 0.2s; font-size: 0.9rem; display: flex; align-items: center; text-decoration: none; }
        .nav-link:hover { background: #f6f9fc; color: var(--primary-color); }
        .nav-link.active { background: var(--primary-color); color: white !important; box-shadow: 0 4px 6px rgba(50, 50, 93, .11); }
        .nav-link i { width: 20px; margin-right: 15px; font-size: 1rem; }

        /* Main Content */
        .main-content { margin-left: var(--sidebar-width); padding: 2rem; min-height: 100vh; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        
        /* Stat Cards */
        .stat-card { border: none; border-radius: 1rem; color: white; padding: 1.5rem; position: relative; overflow: hidden; height: 100%; transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon-bg { position: absolute; right: 10px; top: 10px; font-size: 3rem; opacity: 0.25; }
        .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-bottom: 0; position: relative; z-index: 1; }
        .stat-card .label { font-size: 0.85rem; font-weight: 600; opacity: 0.9; margin-bottom: 5px; position: relative; z-index: 1; }

        .bg-gradient-purple { background: linear-gradient(87deg, #233329 0, #63d471 100%); }
        .bg-gradient-green { background: linear-gradient(87deg, #11998e 0, #38ef7d 100%); }
        .bg-gradient-orange { background: linear-gradient(87deg, #ee0979 0, #ff6a00 100%); }
        .bg-gradient-blue { background: linear-gradient(87deg, #0052D4 0, #6FB1FC 100%); }

        .card-custom { background: white; border: none; border-radius: 1rem; box-shadow: 0 0 2rem 0 rgba(136, 152, 170, .15); margin-bottom: 2rem; }
        .card-custom .card-header { background: transparent; border-bottom: 1px solid #f0f2f5; padding: 1.25rem 1.5rem; font-weight: 600; color: #32325d; display: flex; justify-content: space-between; align-items: center; }
        
        .form-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.025em; color: #8898aa; font-weight: 700; }
        .badge-price { background-color: #f0f7ff; color: #5e72e4; font-weight: 600; padding: 0.5em 0.8em; border-radius: 0.5rem; }
        #loadingSpinner, #productSpinner { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="#" class="sidebar-brand"><i class="fa-solid fa-gear me-2"></i>Admin <span class="fw-light">Panel</span></a>
        
        <div class="nav-section-title">QUẢN LÝ</div>
        <nav class="nav flex-column mb-4">
            <a class="nav-link active" href="#"><i class="fa-solid fa-chart-pie"></i> Bảng Điều Khiển</a>
        </nav>

        <div class="mt-auto">
            <a class="nav-link" href="#"><i class="fa-solid fa-house"></i> Về Trang Chủ</a>
            <a class="nav-link text-danger" href="#"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header-top">
            <h2 class="h4 mb-0 fw-bold text-dark">Bảng điều khiển</h2>
            <div class="d-flex align-items-center">
                <span class="me-3 small text-muted fw-bold">admin</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=5e72e4&color=fff" class="rounded-circle shadow-sm" width="38" alt="avatar">
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card bg-gradient-purple">
                    <div class="label">Tổng Cửa Hàng</div>
                    <div class="value" id="countStore">--</div>
                    <i class="fa-solid fa-shop icon-bg"></i>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-green">
                    <div class="label">Tổng Món Ăn</div>
                    <div class="value" id="countProduct">--</div>
                    <i class="fa-solid fa-bowl-food icon-bg"></i>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-orange">
                    <div class="label">Đơn Chờ Duyệt</div>
                    <div class="value">0</div>
                    <i class="fa-solid fa-file-circle-exclamation icon-bg"></i>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-gradient-blue">
                    <div class="label">Tổng Người Dùng</div>
                    <div class="value" id="countUser">0</div> 
                    <i class="fa-solid fa-users icon-bg"></i>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4">
                <div class="card-custom">
                    <div class="card-header text-primary"><span><i class="fa-solid fa-plus me-2"></i>Thêm cửa hàng</span></div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label">Tên cửa hàng</label>
                            <input type="text" class="form-control" id="storeName" placeholder="Tên chi nhánh...">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Địa chỉ</label>
                            <textarea class="form-control" id="storeAddress" rows="2" placeholder="Địa chỉ chi tiết..."></textarea>
                        </div>
                        <button onclick="addStore()" class="btn btn-primary w-100 py-2 fw-bold">
                            Lưu cửa hàng <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-1"></span>
                        </button>
                    </div>
                </div>

                <div class="card-custom">
                    <div class="card-header text-success"><span><i class="fa-solid fa-utensils me-2"></i>Thêm món ăn</span></div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label class="form-label">Chọn Cửa Hàng</label>
                            <select class="form-select" id="productStoreId"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên món</label>
                            <input type="text" class="form-control" id="productName">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Giá tiền (VNĐ)</label>
                            <input type="number" class="form-control" id="productPrice">
                        </div>
                        <button onclick="addProduct()" class="btn btn-success w-100 py-2 fw-bold">
                            Thêm vào Menu <span id="productSpinner" class="spinner-border spinner-border-sm ms-1"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card-custom">
                    <div class="card-header">
                        <span>Danh sách cửa hàng</span>
                        <button class="btn btn-sm btn-link text-muted" onclick="loadStores()"><i class="fa-solid fa-sync"></i></button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 280px;">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4 border-0" style="font-size: 0.7rem;">TÊN CỬA HÀNG</th>
                                        <th class="border-0" style="font-size: 0.7rem;">ĐỊA CHỈ</th>
                                        <th class="text-center border-0" style="font-size: 0.7rem;">XÓA</th>
                                    </tr>
                                </thead>
                                <tbody id="storeTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card-custom">
                    <div class="card-header">
                        <span>Danh sách món ăn</span>
                        <button class="btn btn-sm btn-link text-muted" onclick="loadProducts()"><i class="fa-solid fa-sync"></i></button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4 border-0" style="font-size: 0.7rem;">MÓN ĂN</th>
                                        <th class="border-0" style="font-size: 0.7rem;">CỬA HÀNG</th>
                                        <th class="border-0" style="font-size: 0.7rem;">GIÁ</th>
                                        <th class="text-center border-0" style="font-size: 0.7rem;">XÓA</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Giữ nguyên phần Script của bạn
        const API_STORE_URL = '/dashboard/api/stores/';
        const API_PRODUCT_URL = '/dashboard/api/products/';
        const CSRF_TOKEN = '{{ csrf_token }}'; 

        function loadStores() {
            fetch(API_STORE_URL).then(res => res.json()).then(data => {
                document.getElementById('countStore').innerText = data.length;
                let tableHtml = '';
                let selectHtml = '<option value="">-- Chọn cửa hàng --</option>';
                data.forEach(store => {
                    tableHtml += `<tr>
                        <td class="ps-4 fw-bold text-dark">${store.name}</td>
                        <td><small class="text-muted">${store.address || 'N/A'}</small></td>
                        <td class="text-center">
                            <button class="btn btn-link text-danger" onclick="deleteStore(${store.id})"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>`;
                    selectHtml += `<option value="${store.id}">${store.name}</option>`;
                });
                document.getElementById('storeTableBody').innerHTML = tableHtml || '<tr><td colspan="3" class="text-center p-4">Trống</td></tr>';
                document.getElementById('productStoreId').innerHTML = selectHtml;
            });
        }

        function loadProducts() {
            fetch(API_PRODUCT_URL).then(res => res.json()).then(data => {
                document.getElementById('countProduct').innerText = data.length;
                let html = '';
                data.forEach(item => {
                    html += `<tr>
                        <td class="ps-4 fw-bold text-dark">${item.name}</td>
                        <td><span class="badge bg-light text-muted border">${item.store_name || 'N/A'}</span></td>
                        <td><span class="badge badge-price">${Number(item.price).toLocaleString()}đ</span></td>
                        <td class="text-center">
                            <button class="btn btn-link text-danger" onclick="deleteProduct(${item.id})"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>`;
                });
                document.getElementById('productTableBody').innerHTML = html || '<tr><td colspan="4" class="text-center p-4 text-muted">Chưa có món nào.</td></tr>';
            });
        }

        async function addStore() {
            const name = document.getElementById('storeName').value;
            const address = document.getElementById('storeAddress').value;
            if(!name || !address) return alert("Nhập đủ thông tin!");
            document.getElementById('loadingSpinner').style.display = "inline-block";
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                const geoData = await geoRes.json();
                const res = await fetch(API_STORE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                    body: JSON.stringify({ name, address, latitude: geoData[0]?.lat || 0, longitude: geoData[0]?.lon || 0 })
                });
                if(res.ok) { document.getElementById('storeName').value = ''; document.getElementById('storeAddress').value = ''; loadStores(); }
            } catch (err) { console.error(err); }
            finally { document.getElementById('loadingSpinner').style.display = "none"; }
        }

        async function addProduct() {
            const storeId = document.getElementById('productStoreId').value;
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            if(!storeId || !name || !price) return alert("Điền đủ thông tin!");
            document.getElementById('productSpinner').style.display = "inline-block";
            try {
                const res = await fetch(API_PRODUCT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
                    body: JSON.stringify({ store: storeId, name: name, price: price })
                });
                if(res.ok) { document.getElementById('productName').value = ''; document.getElementById('productPrice').value = ''; loadProducts(); }
            } catch (e) { console.error(e); }
            finally { document.getElementById('productSpinner').style.display = "none"; }
        }

        function deleteStore(id) { if(confirm('Xóa?')) fetch(`${API_STORE_URL}${id}/`, { method: 'DELETE', headers: {'X-CSRFToken': CSRF_TOKEN} }).then(loadStores); }
        function deleteProduct(id) { if(confirm('Xóa?')) fetch(`${API_PRODUCT_URL}${id}/`, { method: 'DELETE', headers: {'X-CSRFToken': CSRF_TOKEN} }).then(loadProducts); }

        document.addEventListener("DOMContentLoaded", () => { loadStores(); loadProducts(); });
    </script>
</body>
</html>
