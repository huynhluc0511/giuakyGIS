<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Truy Cập Admin Bị Từ Chối!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 50%, #f97316 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow-x: hidden;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            font-size: 6rem;
            background: linear-gradient(45deg, #dc2626, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #dc2626;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .error-message {
            font-size: 1.2rem;
            color: #7c2d12;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .admin-icon {
            font-size: 3rem;
            margin: 1rem 0;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .back-button {
            background: linear-gradient(45deg, #dc2626, #ea580c);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.4);
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(220, 38, 38, 0.6);
            background: linear-gradient(45deg, #b91c1c, #d97706);
        }

        .back-button:active {
            transform: translateY(-1px);
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .icon1 { top: 10%; left: 10%; animation-delay: 0s; }
        .icon2 { top: 20%; right: 10%; animation-delay: 2s; }
        .icon3 { bottom: 20%; left: 5%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-icon {
                font-size: 4rem;
            }

            .admin-icon {
                font-size: 2.5rem;
            }

            .back-button {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .error-title {
                font-size: 1.8rem;
            }

            .error-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-icon icon1">🛡️</div>
    <div class="floating-icon icon2">⚠️</div>
    <div class="floating-icon icon3">🚫</div>

    <div class="error-container">
        <div class="error-icon">�</div>
        <h1 class="error-title">403 - Truy Cập Admin Bị Từ Chối!</h1>
        <div class="admin-icon">�‍💼</div>
        <p class="error-message">
            <strong>Truy cập vào khu vực quản trị bị từ chối!</strong><br><br>
            Bạn không có quyền truy cập vào trang quản trị của hệ thống.<br>
            Vui lòng liên hệ với quản trị viên nếu bạn cần quyền truy cập.<br><br>
            <em>Chỉ quản trị viên mới được vào khu vực này! �</em>
        </p>
        <a href="{% url 'home' %}" class="back-button">
            Quay lại trang chủ
        </a>
    </div>
</body>
</html>
