<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn Hamburger - FastFood Universe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; color: #333; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Nav & Header */
        nav { background: #ffb703; padding: 15px 0; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        .btn-back { color: #333; text-decoration: none; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
        .btn-back:hover { color: #d62828; transform: translateX(-5px); }
        .cart-link { text-decoration: none; color: #333; background: white; padding: 8px 18px; border-radius: 50px; font-weight: 700; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .cart-link:hover { background: #d62828; color: white; transform: scale(1.05); }

        header { background: #f57c00; color: white; padding: 60px 0; text-align: center; margin-bottom: 40px; box-shadow: 0 5px 15px rgba(245, 124, 0, 0.3); }
        header h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        /* Grid Danh sách */
        .burger-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 60px; }

        /* Thẻ Hamburger */
        .burger-card { 
            background: white; border-radius: 25px; padding: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; 
            text-align: center; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; flex-direction: column; 
        }
        .burger-card:hover { transform: translateY(-15px); box-shadow: 0 20px 40px rgba(245, 124, 0, 0.15); border-color: transparent; }
        
        .burger-img-wrapper { 
            width: 160px; height: 160px; margin: 0 auto 20px; 
            border-radius: 50%; overflow: hidden; 
            border: 6px solid #fff8e1; transition: 0.4s;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            background-color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .burger-img-wrapper img {
            width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease;
        }
        .burger-card:hover .burger-img-wrapper { border-color: #ffecb3; }
        .burger-card:hover .burger-img-wrapper img { transform: scale(1.15) rotate(5deg); }
        
        .burger-card h3 { font-size: 1.4rem; color: #222; font-weight: 700; margin-bottom: 8px; }
        .price { color: #f57c00; font-weight: 800; font-size: 1.3rem; margin-bottom: 20px; }

        /* Tùy chọn (Ẩn) */
        .order-details { 
            max-height: 0; overflow: hidden; transition: all 0.5s ease; opacity: 0; 
            text-align: left; background: #fff8e1; border-radius: 15px; 
        }
        .order-details.active { max-height: 400px; opacity: 1; padding: 15px; margin-bottom: 15px; border: 1px dashed #f57c00; }
        
        .order-details label { font-size: 0.85rem; font-weight: 700; color: #d84315; display: block; margin-bottom: 5px;}
        .order-details select, .order-details input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ffe0b2; border-radius: 8px; font-family: inherit; font-size: 0.9rem; outline: none; }
        .order-details select:focus, .order-details input:focus { border-color: #f57c00; }

        .btn-main { border: none; padding: 13px; border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.3s; font-size: 1rem; }
        .btn-add { background: #f57c00; color: white; box-shadow: 0 5px 15px rgba(245, 124, 0, 0.3); }
        .btn-add:hover { background: #e65100; transform: scale(1.05); }
        .btn-confirm { background: #2a9d8f; color: white; margin-top: 5px; box-shadow: 0 5px 15px rgba(42, 157, 143, 0.3); }
        .btn-confirm:hover { background: #1e7a6e; transform: scale(1.02); }

        footer { background: #1a1a1a; color: white; text-align: center; padding: 50px 0; margin-top: 50px; border-top: 5px solid #ffb703; }
        .footer-brand { color: #ffb703; font-weight: 800; letter-spacing: 1px; display: block; margin-top: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

<nav>
    <div class="container">
        <a href="{% url 'home' %}" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
        
        <a href="/gio-hang/" class="cart-link">
            <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng (<span id="cart-qty">0</span>)
        </a>
    </div>
</nav>

<header>
    <h1 class="header-animate">🍔 Hamburger Custom</h1>
    <p class="header-animate">Nhấn vào món ăn để tùy chỉnh theo ý bạn</p>
</header>

<main class="container">
    <div class="burger-grid">
        
        <div class="burger-card" id="b1" data-aos="fade-up" data-aos-delay="100">
            <div class="burger-img-wrapper">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80" alt="Burger Bò Double">
            </div>
            <h3>Burger Bò Double</h3>
            <p class="price">85.000đ</p>
            <button class="btn-main btn-add" onclick="showOptions('b1')">Thêm vào giỏ</button>

            <div class="order-details">
                <label>Chọn Size:</label>
                <select id="option-b1">
                    <option value="0">Size Vừa (M)</option>
                    <option value="20000">Size Lớn (L) + 20k</option>
                </select>
                <label>Ghi chú:</label>
                <input type="text" id="note-b1" placeholder="Ví dụ: Không hành, nhiều sốt...">
                <button class="btn-main btn-confirm" onclick="processAddToCart('b1', 'Burger Bò Double', 85000, 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80')">Xác nhận thêm</button>
            </div>
        </div>

        <div class="burger-card" id="b2" data-aos="fade-up" data-aos-delay="200">
            <div class="burger-img-wrapper">
                <img src="https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=400&q=80" alt="Burger Gà Cay">
            </div>
            <h3>Burger Gà Cay</h3>
            <p class="price">65.000đ</p>
            <button class="btn-main btn-add" onclick="showOptions('b2')">Thêm vào giỏ</button>

            <div class="order-details">
                <label>Độ cay & Topping:</label>
                <select id="option-b2">
                    <option value="0">Cay vừa (Mặc định)</option>
                    <option value="5000">Siêu cay 🔥 (+5.000đ)</option>
                    <option value="15000">Thêm phô mai chảy (+15.000đ)</option>
                </select>
                <label>Ghi chú:</label>
                <input type="text" id="note-b2" placeholder="Ví dụ: Lấy thêm tương ớt, không rau...">
                <button class="btn-main btn-confirm" onclick="processAddToCart('b2', 'Burger Gà Cay', 65000, 'https://images.unsplash.com/photo-1606755962773-d324e0a13086?auto=format&fit=crop&w=400&q=80')">Xác nhận thêm</button>
            </div>
        </div>

        <div class="burger-card" id="b3" data-aos="fade-up" data-aos-delay="300">
            <div class="burger-img-wrapper">
                <img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=400&q=80" alt="Burger Tôm">
            </div>
            <h3>Burger Tôm</h3>
            <p class="price">75.000đ</p>
            <button class="btn-main btn-add" onclick="showOptions('b3')">Thêm vào giỏ</button>

            <div class="order-details">
                <label>Lựa chọn:</label>
                <select id="option-b3">
                    <option value="0">Nhân tôm truyền thống</option>
                    <option value="10000">Nhân tôm phô mai (+10k)</option>
                </select>
                <label>Ghi chú:</label>
                <input type="text" id="note-b3" placeholder="Ghi chú của bạn...">
                <button class="btn-main btn-confirm" onclick="processAddToCart('b3', 'Burger Tôm', 75000, 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=400&q=80')">Xác nhận thêm</button>
            </div>
        </div>

    </div>
</main>

<footer>
    <div class="container">
        <p>Phát triển bởi:</p>
        <p><strong>Dương Đan Huy</strong> (1250080068) & <strong>Huỳnh Tấn Lực</strong> (1250080110)</p>
        <span class="footer-brand">FASTFOOD UNIVERSE</span>
    </div>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<script>
    AOS.init({ duration: 1000, once: true, offset: 50 });

    anime({
        targets: '.header-animate',
        translateY: [-50, 0],
        opacity: [0, 1],
        easing: 'easeOutBounce',
        duration: 1500,
        delay: anime.stagger(200)
    });

    function showOptions(id) {
        const card = document.getElementById(id);
        card.querySelector('.order-details').classList.add('active');
        card.querySelector('.btn-add').style.display = 'none';
    }

    function processAddToCart(divId, name, basePrice, img) {
        let cart = JSON.parse(localStorage.getItem('cart_data')) || [];
        
        const optionSelect = document.getElementById(`option-${divId}`);
        const extraPrice = optionSelect ? parseInt(optionSelect.value) : 0;
        const finalPrice = basePrice + extraPrice;
        
        const noteElement = document.getElementById(`note-${divId}`);
        const note = noteElement ? noteElement.value : '';
        
        const itemId = `${name}-${finalPrice}`;
        const existingItem = cart.find(item => item.id === itemId && item.note === note);

        if (existingItem) {
            existingItem.qty += 1;
        } else {
            cart.push({
                id: itemId,
                name: name,
                price: finalPrice,
                qty: 1,
                img: img,
                note: note 
            });
        }

        localStorage.setItem('cart_data', JSON.stringify(cart));
        updateCartQty();

        alert(`Đã thêm ${name} vào giỏ hàng thành công!`);
        
        if(noteElement) noteElement.value = '';

        const card = document.getElementById(divId);
        card.querySelector('.order-details').classList.remove('active');
        card.querySelector('.btn-add').style.display = 'block';
    }

    function updateCartQty() {
        const cart = JSON.parse(localStorage.getItem('cart_data')) || [];
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        const qtyDisplay = document.getElementById('cart-qty');
        if (qtyDisplay) qtyDisplay.innerText = totalQty;
    }

    window.addEventListener('storage', (e) => {
        if (e.key === 'cart_data') updateCartQty();
    });

    updateCartQty();
</script>
</body>
</html>
