<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - FastFood Universe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    {% load static %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        nav { background: #ffb703; padding: 15px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .nav-brand { font-size: 1.5rem; font-weight: 800; color: #333; text-decoration: none; transition: 0.3s; display: inline-block; }
        .nav-brand:hover { transform: scale(1.05); color: #d62828; }

        .auth-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }

        .auth-card { 
            background: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 480px; 
            text-align: center; border-top: 5px solid #d62828; border-bottom: 5px solid #ffb703;
            opacity: 0; /* Ẩn mặc định để Anime.js xử lý */
        }

        h2 { color: #d62828; margin-bottom: 25px; font-weight: 800; font-size: 2rem; }
        
        .input-group { text-align: left; margin-bottom: 18px; position: relative; }
        .input-group label { display: block; font-size: 0.95rem; font-weight: 700; color: #444; margin-bottom: 8px; }

        input, select { 
            width: 100%; padding: 14px 15px; border: 2px solid #eee; 
            border-radius: 12px; outline: none; font-family: inherit;
            transition: 0.3s; background: #fafafa;
        }

        input:focus, select:focus { border-color: #ffb703; background: #fff; box-shadow: 0 0 0 4px rgba(255, 183, 3, 0.1); }

        /* Icon mắt nhắm mở mật khẩu */
        .toggle-password {
            position: absolute; right: 15px; top: 42px; cursor: pointer; color: #888; transition: 0.3s;
        }
        .toggle-password:hover { color: #d62828; }

        /* Thanh sức mạnh mật khẩu */
        .password-strength { height: 5px; background: #eee; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: 0.4s ease-out; }

        /* Vùng nhập mã Admin ẩn mặc định */
        #admin-code-group { display: none; margin-top: 15px; border: 2px dashed #d62828; padding: 15px; border-radius: 12px; background: #fff5f5; }

        .btn-submit { 
            width: 100%; padding: 15px; background: #d62828; color: white; 
            border: none; border-radius: 50px; font-weight: 700; font-size: 1.05rem;
            cursor: pointer; margin-top: 15px; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { background: #b01a1a; box-shadow: 0 8px 20px rgba(214, 40, 40, 0.3); transform: translateY(-3px); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        .switch { margin-top: 25px; font-size: 0.95rem; color: #666; }
        .switch a { color: #d62828; text-decoration: none; font-weight: 700; transition: 0.3s; }
        .switch a:hover { color: #ffb703; text-decoration: underline; }

        /* Toast Notification */
        .toast-notification {
            position: fixed; top: 90px; right: -350px; background: #d62828; color: white;
            padding: 15px 25px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1050; display: flex; align-items: center; gap: 10px;
        }
        .toast-notification.show { right: 30px; }

        footer { background: #1a1a1a; color: #aaa; text-align: center; padding: 30px 0; margin-top: auto; border-top: 5px solid #ffb703; }
        footer strong { color: #ffb703; }
    </style>
</head>
<body>

    <nav>
        <div class="container">
            <a href="{% url 'home' %}" class="nav-brand">🍔 FastFood Universe</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card" id="registerCard">
            <h2>Tạo Tài Khoản</h2>
            
            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" id="reg-name" placeholder="Nhập họ và tên" required>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label>Loại tài khoản</label>
                    <select id="reg-role" onchange="toggleAdminField()">
                        <option value="customer">Khách hàng</option>
                        <option value="admin">Quản trị viên (Admin)</option>
                    </select>
                </div>

                <div class="input-group" id="admin-code-group">
                    <label style="color: #d62828;"><i class="fa-solid fa-lock"></i> Mã bảo mật Admin</label>
                    <input type="password" id="admin-secret" placeholder="Nhập mã bí mật">
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="pass" placeholder="Tối thiểu 6 ký tự" required oninput="checkPasswordStrength()">
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('pass', this)"></i>
                    <div class="password-strength"><div class="strength-bar" id="strength-bar"></div></div>
                </div>

                <div class="input-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="repass" placeholder="Nhập lại mật khẩu" required>
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('repass', this)"></i>
                </div>

                <button type="submit" id="btn-register" class="btn-submit">
                    <span id="btn-text">Đăng Ký Ngay</span>
                    <i class="fa-solid fa-spinner fa-spin" id="btn-spinner" style="display: none;"></i>
                </button>
            </form>

            <div class="switch">
                Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notification">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="toast-msg">Lỗi!</span>
    </div>

    <footer>
    <div class="container">
        <p>Phát triển với bởi:</p>
        <p><strong>Dương Đan Huy</strong> (1250080068) & <strong>Huỳnh Tấn Lực</strong> (1250080110)</p>
        <span class="footer-brand">FASTFOOD UNIVERSE</span>
    </div>
</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <script>
        // 1. Hiệu ứng Load Form
        document.addEventListener("DOMContentLoaded", function() {
            anime({
                targets: '#registerCard',
                translateY: [50, 0],
                opacity: [0, 1],
                easing: 'easeOutElastic(1, .8)',
                duration: 1200
            });
        });

        // 2. Hiệu ứng rung Form khi lỗi
        function shakeCard() {
            anime({
                targets: '#registerCard',
                translateX: [0, -10, 10, -10, 10, 0],
                duration: 400,
                easing: 'easeInOutSine'
            });
        }

        // 3. Hiện/Ẩn mật khẩu
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // 4. Kiểm tra độ mạnh mật khẩu (Minh hoạ UI)
        function checkPasswordStrength() {
            const pass = document.getElementById('pass').value;
            const bar = document.getElementById('strength-bar');
            
            if (pass.length === 0) {
                bar.style.width = '0%';
            } else if (pass.length < 6) {
                bar.style.width = '30%';
                bar.style.background = '#d62828'; // Đỏ (Yếu)
            } else if (pass.length >= 6 && pass.length < 10) {
                bar.style.width = '65%';
                bar.style.background = '#ffb703'; // Vàng (Trung bình)
            } else {
                bar.style.width = '100%';
                bar.style.background = '#2a9d8f'; // Xanh (Mạnh)
            }
        }

        // 5. Hiện ô nhập mã nếu chọn Admin
        function toggleAdminField() {
            const role = document.getElementById('reg-role').value;
            const adminGroup = document.getElementById('admin-code-group');
            adminGroup.style.display = (role === 'admin') ? 'block' : 'none';
        }

        // 6. Hiển thị Toast Error
        function showErrorToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            shakeCard();
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // 7. Xử lý Đăng Ký
        function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const role = document.getElementById('reg-role').value;
            const adminSecret = document.getElementById('admin-secret').value;
            const pass = document.getElementById('pass').value;
            const repass = document.getElementById('repass').value;

            const btn = document.getElementById('btn-register');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            // Kiểm tra lỗi cơ bản
            if (pass.length < 6) {
                return showErrorToast("Mật khẩu phải từ 6 ký tự trở lên!");
            }
            if (pass !== repass) {
                return showErrorToast("Mật khẩu xác nhận không khớp!");
            }
            if (role === 'admin' && adminSecret !== '0000') {
                return showErrorToast("Mã bảo mật Admin không chính xác!");
            }

            // Tạo hiệu ứng Loading
            btnText.innerText = "Đang xử lý...";
            btnSpinner.style.display = "inline-block";
            btn.disabled = true;

            setTimeout(() => {
                // Giả lập lưu vào LocalStorage
                localStorage.setItem('stored_name', name);
                localStorage.setItem('stored_email', email);
                localStorage.setItem('stored_pass', pass);
                localStorage.setItem('stored_role', role);

                // Nút thành công
                btn.style.background = "#2a9d8f";
                btnText.innerText = "Đăng ký thành công!";
                btnSpinner.className = "fa-solid fa-check";

                setTimeout(() => {
                    alert(`✅ Chúc mừng ${name}! Bạn đã đăng ký thành công tài khoản ${role === 'admin' ? 'ADMIN' : 'KHÁCH HÀNG'}.`);
                    window.location.href = "{% url 'login' %}";
                }, 500);
                
            }, 1200); // Giả lập mạng chậm 1.2s
        }
    </script>
</body>
</html>
